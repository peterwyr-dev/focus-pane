name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          package="focus-pane-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$package/docs"
          cp "target/${{ matrix.target }}/release/focus-pane" "dist/$package/"
          cp README.md LICENSE "dist/$package/"
          cp docs/screenshot.png "dist/$package/docs/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256")
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
